services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local-only
      POSTGRES_DB: app
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - app-db:/var/lib/postgresql/data
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://app:local-only@db/app
      APP_PASSWORD: ${APP_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8090}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  app-db:
